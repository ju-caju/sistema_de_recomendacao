name: Testes

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar atividades e testes
        run: make all testes
      - name: Executar regressao C++
        run: ./bin/testes

  integracao-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integracao_python/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r integracao_python/requirements.txt
      - name: Compilar extensao
        working-directory: integracao_python
        run: python setup.py build_ext --inplace
      - name: Executar testes da integracao
        working-directory: integracao_python
        run: python teste_integracao.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
